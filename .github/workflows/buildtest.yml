name: Build Test
# Builds and tests carl-storm on various platforms
# also deploys images to GHCR and Dockerhub (master as 'ci', stable as 'stable')

on:
  push:
    branches:
      - master
      - stable
  schedule:
    # run weekly
    - cron: '0 10 * * 2'
  # needed to trigger the workflow manually
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"

jobs:
  compilerTests:
    # Build and run with different compilers (GCC, Clang)
    # Run on latest Archlinux version to get most recent compiler versions
    # Run on alpine to test with muslc (an glibc alternative).
    # Run on Fedora Rawhide with cln/ginac built from source using the newest available Clang
    name: Compiler Tests (${{ matrix.config.name }} on ${{ matrix.config.distro }}, ${{ matrix.config.build_type }})
    runs-on: ubuntu-latest
    container: ${{ matrix.config.image }}
    strategy:
      fail-fast: ${{ github.event_name != 'schedule' }}
      matrix:
        config:
          - {name: "GCC",
             build_type: "Debug",
             cmake_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCARL_WARNING_AS_ERROR=ON",
             distro: "archlinux",
             image: "archlinux:latest",
             # Updates needed as Archlinux is rolling release
             setup: "pacman -Syu --noconfirm base-devel git cmake boost cln gmp ginac"
            }
          - {name: "Clang",
             build_type: "Debug",
             cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCARL_WARNING_AS_ERROR=ON",
             distro: "archlinux",
             image: "archlinux:latest",
             setup: "pacman -Syu --noconfirm base-devel git cmake boost cln gmp ginac clang"
            }
          - {name: "musl",
             build_type: "Debug",
             cmake_args: "-DCARL_WARNING_AS_ERROR=ON",
             distro: "alpine",
             image: "alpine:edge",
             setup: "apk add --no-cache cmake make gcc g++ git bash musl-dev linux-headers boost-dev gmp-dev cln-dev ginac-dev"
            }
          - {name: "Clang (CLN/Ginac from source)",
             build_type: "Debug",
             cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCARL_WARNING_AS_ERROR=ON",
             distro: "fedora-rawhide",
             image: "fedora:rawhide",
             setup: "dnf install -y autoconf automake bzip2 clang cmake gcc gcc-c++ git gzip libtool make tar wget which zstd boost-devel gmp-devel gmp-c++",
             cln_ginac_from_source: true
            }
    env:
      # Pin the exact cln/ginac versions carl-storm currently targets (only used when building from source)
      CLN_VERSION: "1.3.7"
      GINAC_VERSION: "1.8.10"
    steps:
      # Install packages first to have git available for the checkout
      - name: Install packages
        run: ${{ matrix.config.setup }}
      - name: Git clone
        uses: actions/checkout@v7
      - name: Determine Clang version
        if: matrix.config.cln_ginac_from_source
        id: clang-version
        run: echo "version=$(clang --version | head -n 1 | tr -c 'a-zA-Z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore CLN/GiNaC cache
        if: matrix.config.cln_ginac_from_source
        id: cache-cln-ginac
        uses: actions/cache@v6
        with:
          path: /usr/local
          # Rebuild when the versions or the Clang version change
          key: cln-${{ env.CLN_VERSION }}-ginac-${{ env.GINAC_VERSION }}-${{ matrix.config.distro }}-${{ steps.clang-version.outputs.version }}
      - name: Build CLN/GiNaC from source with Clang
        if: matrix.config.cln_ginac_from_source && steps.cache-cln-ginac.outputs.cache-hit != 'true'
        working-directory: /opt
        run: |
          wget -q "https://www.ginac.de/CLN/cln-${CLN_VERSION}.tar.bz2"
          tar xjf "cln-${CLN_VERSION}.tar.bz2"
          (cd "cln-${CLN_VERSION}" && CC=clang CXX=clang++ ./configure --prefix=/usr/local && make -j ${NR_JOBS} && make install)
          wget -q "https://www.ginac.de/ginac-${GINAC_VERSION}.tar.bz2"
          tar xjf "ginac-${GINAC_VERSION}.tar.bz2"
          (cd "ginac-${GINAC_VERSION}" && CC=clang CXX=clang++ PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig ./configure --prefix=/usr/local && make -j ${NR_JOBS} && make install)
      - name: Register CLN/GiNaC libraries
        if: matrix.config.cln_ginac_from_source
        run: |
          echo /usr/local/lib > /etc/ld.so.conf.d/usr-local.conf
          echo /usr/local/lib64 >> /etc/ld.so.conf.d/usr-local.conf
          ldconfig
      - name: Configure Carl-storm
        # Inputs are passed via environment variables to avoid shell injection
        env:
          BUILD_TYPE: ${{ matrix.config.build_type }}
          CMAKE_ARGS: ${{ matrix.config.cmake_args }}
        # CMAKE_ARGS is intentionally unquoted to split it into separate arguments
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCARL_PORTABLE=ON $CMAKE_ARGS
      - name: Build Carl-storm
        run: cmake --build build --target lib_carl -j ${NR_JOBS}
      - name: Build tests
        run: cmake --build build -j ${NR_JOBS}
      - name: Run tests
        run: ctest --test-dir build --output-on-failure


  linuxTests:
    name: Linux Tests (${{ matrix.distro }}, ${{ matrix.build_type }}) on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/stormchecker/storm-basesystem:${{ matrix.distro }}
    strategy:
      fail-fast: ${{ github.event_name != 'schedule' }}
      matrix:
        distro: ["debian-12", "ubuntu-24.04", "debian-13", "minimal_dependencies"]
        build_type: ["Debug", "Release"]
        runner: [ubuntu-latest]

    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Configure Carl-storm
        # Inputs are passed via environment variables to avoid shell injection
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCARL_PORTABLE=ON -DCARL_WARNING_AS_ERROR=ON
      - name: Build Carl-storm
        run: cmake --build build --target lib_carl -j ${NR_JOBS}
      - name: Build tests
        run: cmake --build build -j ${NR_JOBS}
      - name: Run tests
        run: ctest --test-dir build --output-on-failure


  macTests:
    name: macOS Tests (${{ matrix.config.name }}, ${{ matrix.config.build_type }})
    strategy:
      fail-fast: ${{ github.event_name != 'schedule' }}
      matrix:
        config:
          - {name: "MacOS 15, ARM",
             distro: "macos-15",
             xcode: "16.4",
             build_type: "Debug"
            }
          - {name: "MacOS 26, ARM",
             distro: "macos-26",
             xcode: "latest-stable",
             build_type: "Debug"
            }
          - {name: "MacOS 26, Intel",
             distro: "macos-26-intel",
             xcode: "latest-stable",
             build_type: "Debug"
            }
          - {name: "MacOS 27, ARM",
             distro: "xcode-27",
             xcode: "latest",
             build_type: "Debug"
            }
    runs-on: ${{ matrix.config.distro }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install dependencies
        # cmake and gmp are already installed
        run: |
          brew update
          brew install boost cln ginac
      - name: Configure Carl-storm
        # Inputs are passed via environment variables to avoid shell injection
        env:
          BUILD_TYPE: ${{ matrix.config.build_type }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCARL_WARNING_AS_ERROR=ON
      - name: Build Carl-storm
        run: cmake --build build --target lib_carl -j ${NR_JOBS}
      - name: Build tests
        run: cmake --build build -j ${NR_JOBS}
      - name: Run tests
        run: ctest --test-dir build --output-on-failure


  deploy:
    name: Test and Deploy
    # Run deployments for the same branch in sequence to ensure correct deployment
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    uses: stormchecker/ci-workflows/.github/workflows/release_docker.yml@v2
    permissions:
      contents: read
      packages: write  # to push to GHCR
      id-token: write  # to sign the provenance of the images
    with:
      image: |
        ghcr.io/stormchecker/carl-storm
        movesrwth/carl-storm
      tag: ${{ github.ref == 'refs/heads/stable' && 'stable' || 'ci' }}
      # Always build and test, but only deploy master/stable (and not for pull requests). Check for forks is done in the shared workflow.
      push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/stable') }}
      build_args: |
        BASE_IMAGE=ghcr.io/stormchecker/storm-basesystem:latest
        cmake_args=-DCARL_WARNING_AS_ERROR=ON
        run_tests=ON
    secrets: inherit

  notify:
    name: Email notification
    needs: [compilerTests, linuxTests, macTests, deploy]
    # Only run in main repo and even if previous step failed
    if: github.repository_owner == 'stormchecker' && always()
    uses: stormchecker/ci-workflows/.github/workflows/notify_email.yml@v2
    with:
      title: Build Test
    secrets: inherit
    permissions:
      actions: read
