name: Build Test
# Builds and tests carl-storm on various platforms
# also deploys images to Dockerhub (master as 'ci', stable as 'stable')

on:
  push:
    branches:
      - master
      - stable
  schedule:
    # run weekly
    - cron: '0 10 * * 2'
  # needed to trigger the workflow manually
  workflow_dispatch:
  pull_request:

env:
  # GitHub runners currently have 4 cores
  NR_JOBS: "4"

jobs:
  compilerTests:
    # Build and run with different compilers (GCC, Clang)
    # Run on latest Archlinux version to get most recent compiler versions
    # Run on alpine to test with muslc (an glibc alternative).
    # Run on Fedora Rawhide with cln/ginac built from source using the newest available Clang
    name: Compiler Tests (${{ matrix.config.name }} on ${{ matrix.config.distro }}, ${{ matrix.config.build_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - {name: "GCC",
             build_type: "Debug",
             cmake_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCARL_WARNING_AS_ERROR=ON",
             packages: "",
             distro: "archlinux"
            }
          - {name: "Clang",
             build_type: "Debug",
             cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCARL_WARNING_AS_ERROR=ON",
             packages: "clang",
             distro: "archlinux"
            }
          - {name: "musl",
             build_type: "Debug",
             cmake_args: "-DCARL_WARNING_AS_ERROR=ON",
             packages: "",
             distro: "alpine"
            }
          - {name: "Clang (CLN/Ginac from source)",
             build_type: "Debug",
             cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCARL_WARNING_AS_ERROR=ON",
             packages: "",
             distro: "fedora-rawhide"
            }
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Build Carl-storm from Dockerfile
        run: |
          docker build -t movesrwth/carl-storm:ci . -f .github/workflows/Dockerfile.${{ matrix.config.distro }} \
            --build-arg build_type="${{ matrix.config.build_type }}" \
            --build-arg cmake_args="${{ matrix.config.cmake_args }}" \
            --build-arg packages="${{ matrix.config.packages }}" \
            --build-arg no_threads=${NR_JOBS}
      - name: Run Docker
        run: docker run -d -it --name ci movesrwth/carl-storm:ci
      - name: Build tests
        run: docker exec ci bash -c "cd /opt/carl/build; make -j ${NR_JOBS}"
      - name: Run tests
        run: docker exec ci bash -c "cd /opt/carl/build; ctest test --output-on-failure"


  linuxTests:
    name: Linux Tests (${{ matrix.distro }}, ${{ matrix.build_type }}) on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        distro: ["debian-12", "ubuntu-24.04", "debian-13", "minimal_dependencies"]
        build_type: ["Debug", "Release"]
        runner: [ubuntu-latest]

    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Build Carl-storm from Dockerfile
        run: |
          docker build -t movesrwth/carl-storm:ci . \
            --build-arg BASE_IMAGE=movesrwth/storm-basesystem:${{ matrix.distro }} \
            --build-arg build_type="${{ matrix.build_type }}" \
            --build-arg cmake_args="-DCARL_WARNING_AS_ERROR=ON" \
            --build-arg no_threads=${NR_JOBS}
      - name: Run Docker
        run: docker run -d -it --name ci movesrwth/carl-storm:ci
      - name: Build tests
        run: docker exec ci bash -c "cd /opt/carl/build; make -j ${NR_JOBS}"
      - name: Run tests
        run: docker exec ci bash -c "cd /opt/carl/build; ctest test --output-on-failure"


  macTests:
    name: macOS Tests (${{ matrix.config.name }}, ${{ matrix.config.build_type }})
    strategy:
      matrix:
        config:
          - {name: "MacOS 15, ARM",
             distro: "macos-15",
             xcode: "16.4",
             build_type: "Debug"
            }
          - {name: "MacOS 26, ARM",
             distro: "macos-26",
             xcode: "latest-stable",
             build_type: "Debug"
            }
          - {name: "MacOS 26, Intel",
             distro: "macos-26-intel",
             xcode: "latest-stable",
             build_type: "Debug"
            }
          - {name: "MacOS 27, ARM",
             distro: "xcode-27",
             xcode: "latest",
             build_type: "Debug"
            }
    runs-on: ${{ matrix.config.distro }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.config.xcode }}
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install dependencies
        # cmake and gmp are already installed
        run: |
          brew update
          brew install boost cln ginac
      - name: Configure Carl-storm
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE="${{ matrix.config.build_type }}" -DCARL_WARNING_AS_ERROR=ON
      - name: Build Carl-storm
        working-directory: ./build
        run: make lib_carl -j ${NR_JOBS}
      - name: Build tests
        working-directory: ./build
        run: make -j ${NR_JOBS}
      - name: Run tests
        working-directory: ./build
        run: ctest test --output-on-failure


  deploy:
    name: Test and Deploy
    uses: stormchecker/ci-workflows/.github/workflows/release_docker.yml@v1
    permissions:
      contents: read
      id-token: write  # to sign the provenance of the images
    with:
      image: movesrwth/carl-storm
      tag: ${{ github.ref == 'refs/heads/stable' && 'stable' || 'ci' }}
      # Always build and test, but only deploy master/stable (and not for pull requests). Check for forks is done in the shared workflow.
      push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/stable') }}
      build_args: |
        BASE_IMAGE=movesrwth/storm-basesystem:latest
        cmake_args=-DCARL_WARNING_AS_ERROR=ON
        run_tests=ON
    secrets: inherit

  notify:
    name: Email notification
    needs: [compilerTests, linuxTests, macTests, deploy]
    # Only run in main repo and even if previous step failed
    if: github.repository_owner == 'stormchecker' && always()
    uses: stormchecker/ci-workflows/.github/workflows/notify_email.yml@v1
    with:
      title: Build Test
    secrets: inherit
    permissions:
      actions: read
