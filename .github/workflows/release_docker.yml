name: Release Docker
# Builds carl-storm and deploys images to Dockerhub
# The images are built from the ref selected when triggering the workflow (e.g. a tag or the stable branch)

on:
  # needed to trigger the workflow manually
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (e.g. 1.1.0 or stable)'
        required: true
        type: string
        default: 'x.y.z'

jobs:
  release:
    uses: stormchecker/ci-workflows/.github/workflows/release_docker.yml@v1
    permissions:
      contents: read
      id-token: write  # to sign the provenance of the images
    with:
      image: movesrwth/carl-storm
      tag: ${{ inputs.tag }}
      build_args: |
        BASE_IMAGE=movesrwth/storm-basesystem:latest
    secrets: inherit
