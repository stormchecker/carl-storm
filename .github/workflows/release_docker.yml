name: Release Docker
# Builds carl-storm and deploys images to Dockerhub
# The images are built from the tag or branch (stable or master) selected when triggering the workflow.
# The Docker tag is the name of the selected ref (e.g. 1.1.0 or stable), master yields the tag 'ci'.

on:
  # needed to trigger the workflow manually
  workflow_dispatch:

jobs:
  release:
    # Only allow tags and the stable/master branches
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/master'
    uses: stormchecker/ci-workflows/.github/workflows/release_docker.yml@v1
    permissions:
      contents: read
      id-token: write  # to sign the provenance of the images
    with:
      image: movesrwth/carl-storm
      tag: ${{ github.ref == 'refs/heads/master' && 'ci' || github.ref_name }}
      build_args: |
        BASE_IMAGE=movesrwth/storm-basesystem:latest
    secrets: inherit
