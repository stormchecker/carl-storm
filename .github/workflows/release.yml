name: Release new version
# Triggered by new a release on Github
# - deploys Docker containers
# - updates stable branch (which also triggers the build of the 'stable' Docker containers)
# - updates carl-storm version in Storm

# Needs personal access token CI_token with permissions 'pull-requests' and 'workflows'

on:
  release:
    types: [published]

jobs:
  deploy_docker:
    # Create Docker images for tag
    uses: stormchecker/ci-workflows/.github/workflows/release_docker.yml@v1
    permissions:
      contents: read
      id-token: write  # to sign the provenance of the images
    with:
      image: movesrwth/carl-storm
      # Use the tag from the release
      tag: ${{ github.event.release.tag_name }}
      build_args: |
        BASE_IMAGE=movesrwth/storm-basesystem:latest
    secrets: inherit

  update_stable:
    # Update stable branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Rebase
        run: |
          git config user.name 'Stormchecker bot'
          git config user.email 'dev@stormchecker.org'
          git fetch origin stable
          git checkout stable
          git rebase ${{ github.event.release.tag_name }}
          git push origin stable
      - name: Trigger Build Test for stable
        # Pushes using the GITHUB_TOKEN do not trigger workflows, so trigger the Build Test (which deploys the 'stable' Docker images) manually
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run buildtest.yml --repo ${{ github.repository }} --ref stable

  update_storm:
    # Trigger generation of PR in Storm which updates the carl-storm version
    needs: [deploy_docker, update_stable]
    uses: stormchecker/storm/.github/workflows/update_carl.yml@master
    with:
      carl_version: ${{ github.event.release.tag_name }}
    secrets:
      personal_access_token: ${{ secrets.CI_token }}

  notify:
    name: Email notification
    needs: [deploy_docker, update_stable, update_storm]
    # Only run in main repo and even if previous step failed
    if: github.repository_owner == 'stormchecker' && always()
    uses: stormchecker/ci-workflows/.github/workflows/notify_email.yml@v1
    with:
      title: Release
    secrets: inherit
    permissions:
      actions: read
